<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>

    <div class="wrapper">
        <h1>Finish your profile!</h1>
        <form id="form">

            <div class="profile-pic-container">
                <label for="file-input" class="profile-pic-label">
                    <img id="preview" src="img/default-avatar.png" alt="Profile Preview">
                    <div class="upload-overlay">
                        <i class="fas fa-camera"></i> <span>Change Photo</span>
                    </div>
                </label>
                <input id="file-input" type="file" accept="image/*" onchange="previewImage(event)">
            </div>
            <div>
                <label for="bio-input"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M200-246q54-53 125.5-83.5T480-360q83 0 154.5 30.5T760-246v-514H200v514Zm280-194q58 0 99-41t41-99q0-58-41-99t-99-41q-58 0-99 41t-41 99q0 58 41 99t99 41ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm69-80h422q-44-39-99.5-59.5T480-280q-56 0-112.5 20.5T269-200Zm211-320q-25 0-42.5-17.5T420-580q0-25 17.5-42.5T480-640q25 0 42.5 17.5T540-580q0 25-17.5 42.5T480-520Zm0 17Z"/></svg></label>
                <input type="text" id="bio-input" placeholder="Type your bio here!">
            </div>

            
            <
            <button type="submit">Save Changes</button>
            <div id="error-div"></div>
        </form>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="profile.js"></script>
</body>
</html>
